[project]
name = "testomat-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faker==37.12.0",
    "playwright==1.55.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-html==4.1.1",
    "pytest-playwright==0.7.1",
    "python-dotenv==1.2.1",
    "ruff>=0.15.0",
    "requests==2.32.5",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "datamodel-code-generator>=00.53.0",
]

[tool.datamodel-codegen]
input = "./api_testomat.yaml"
output = "./src/api/models/models.py"
target-python-version = "3.14"
snake-case-field = true
field-constraints = true